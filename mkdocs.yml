site_name: memhub
site_description: Personal Memory Hub & Dual-System Layered Memory SDK for AI Agents
site_url: https://shibing624.github.io/memhub
repo_url: https://github.com/shibing624/memhub
repo_name: shibing624/memhub
edit_uri: blob/main/docs/

exclude_docs: |
  hy-memory-test/**
  superpowers/**

theme:
  name: readthedocs
  locale: zh
  highlightjs: true
  hljs_languages:
    - python
    - bash
    - yaml
    - json
  navigation_depth: 3
  collapse_navigation: false
  sticky_navigation: true
  prev_next_buttons_location: bottom
  include_homepage_in_sidebar: true
  favicon: public/favicon.png

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - MemHub:
      - Overview: memhub.md
      - Multi-device sync: memhub-server.md
  - Integrations:
      - Frameworks & tools: integrations.md
      - MCP / REST: mcp_integration.md
  - Benchmarks: benchmarks.md
  - Developer guide:
      - Architecture: architecture.md
      - Memory layers: memory_layers.md
      - Write decisions: jev-memory-design.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - md_in_html
  - pymdownx.details
  - tables
  - toc:
      permalink: true

plugins:
  - search
