<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memhub 记忆</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect width='64' height='64' rx='14' fill='%230f1419' stroke='%23243042' stroke-width='2'/%3E%3Cg stroke='%235fb3f0' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M29 18a6 6 0 0 0-10 3 6.5 6.5 0 0 0-3 11 6.5 6.5 0 0 0 2 11 6 6 0 0 0 11 3V18Z'/%3E%3Cpath d='M21 26c2 0 4 1.5 4 3.5M20 37c2.5 0 4.5-1.5 5-3.5'/%3E%3Cpath d='M18 18L10 10M10 16V10h6'/%3E%3Cpath d='M18 46L10 54M16 54h-6v-6'/%3E%3C/g%3E%3Cg stroke='%23d3a0ff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M35 18a6 6 0 0 1 10 3 6.5 6.5 0 0 1 3 11 6.5 6.5 0 0 1-2 11 6 6 0 0 1-11 3V18Z'/%3E%3Cpath d='M43 26c-2 0-4 1.5-4 3.5M44 37c-2.5 0-4.5-1.5-5-3.5'/%3E%3Cpath d='M46 18l8-8M48 10h6v6'/%3E%3Cpath d='M46 46l8 8M54 48v6h-6'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root { --bg:#0f1419; --panel:#161d26; --line:#243042; --text:#e7ecf3; --dim:#8b96a5;
          --accent:#5fb3f0; --warn:#f0a35f; --bad:#f07a7a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,
         "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif; }
  .app { display:grid; grid-template-columns:240px 1fr; height:100vh; }
  aside { border-right:1px solid var(--line); overflow:auto; padding:16px 12px; background:var(--panel); }
  .brand { display:flex; align-items:center; gap:9px; padding:2px 8px 12px; margin-bottom:6px;
           border-bottom:1px solid var(--line); font-weight:600; font-size:15px; color:#fff; letter-spacing:.02em; }
  .brand svg { width:24px; height:24px; flex-shrink:0; }
  aside h2 { font-size:12px; color:var(--dim); margin:18px 8px 6px; font-weight:600; letter-spacing:.06em; }
  aside h2:first-of-type { margin-top:8px; }
  .nav { display:flex; justify-content:space-between; padding:5px 8px; border-radius:6px;
         cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nav:hover { background:#1e2836; }
  .nav.on { background:#23344a; color:#fff; }
  .nav span:last-child { color:var(--dim); margin-left:8px; }
  main { overflow:auto; padding:18px 28px 60px; }
  .bar { display:flex; gap:10px; align-items:center; position:sticky; top:-18px; padding:12px 0;
         background:var(--bg); z-index:1; flex-wrap:wrap; }
  input[type=search] { flex:1; min-width:240px; padding:9px 12px; border-radius:8px;
         border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:14px; }
  button { padding:7px 12px; border-radius:7px; border:1px solid var(--line);
           background:#1e2836; color:var(--text); cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:#1f4f7a; border-color:#2b6aa3; }
  button.danger { color:var(--bad); }
  label.chk { color:var(--dim); font-size:13px; user-select:none; }
  .summary { color:var(--dim); margin:2px 0 14px; font-size:13px; }
  .card { border:1px solid var(--line); border-radius:10px; background:var(--panel);
          padding:12px 16px; margin-bottom:10px; }
  .card.old { opacity:.55; }
  .head { display:flex; gap:8px; align-items:baseline; cursor:pointer; }
  .title { flex:1; white-space:pre-wrap; word-break:break-word; }
  .tag { font-size:11px; padding:1px 7px; border-radius:10px; border:1px solid var(--line);
         color:var(--dim); white-space:nowrap; }
  .tag.k-procedure { color:#9fd88a; border-color:#3c5a33; }
  .tag.k-profile { color:#d3a0ff; border-color:#4d3a66; }
  .tag.k-intention { color:var(--warn); border-color:#5c4330; }
  .tag.k-raw { color:#8ecae6; border-color:#2f4b5a; }
  .meta { color:var(--dim); font-size:12px; margin-top:4px; }
  .body { margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; }
  .body pre { white-space:pre-wrap; word-break:break-word; margin:0 0 10px; font:inherit; }
  .body h4 { margin:12px 0 4px; font-size:12px; color:var(--dim); font-weight:600; }
  .body textarea { width:100%; min-height:160px; background:var(--bg); color:var(--text);
         border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; }
  .chain { border-left:2px solid var(--line); padding-left:10px; margin:6px 0; }
  .chain div { margin:4px 0; white-space:pre-wrap; word-break:break-word; }
  .chain .cur { color:var(--text); }
  .chain .past { color:var(--dim); text-decoration:line-through; text-decoration-color:#555; }
  .actions { display:flex; gap:8px; margin-top:8px; }
  .hit { outline:1px solid var(--accent); }
  .empty { color:var(--dim); padding:40px; text-align:center; }
  .login { max-width:520px; margin:80px auto; }
  .login code { background:var(--panel); padding:2px 6px; border-radius:4px; }
  #toast { position:fixed; right:20px; bottom:20px; background:#23344a; padding:10px 14px;
           border-radius:8px; display:none; }
  @media (max-width:800px) { .app { grid-template-columns:1fr; } aside { display:none; } }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script>
const KIND = { procedure: "工程经验", fact: "事实", profile: "画像", intention: "待办意图",
               raw: "原始对话", schema: "归纳", summary: "摘要", preference: "偏好" };
const state = { token: "", rows: [], byId: {}, project: "*", kind: "*", text: "",
                history: false, hits: null, open: new Set(), editing: null };

function readToken() {
  const hash = new URLSearchParams(location.hash.slice(1));
  const fromHash = hash.get("token");
  if (fromHash) {
    sessionStorage.setItem("hub-token", fromHash);
    history.replaceState(null, "", location.pathname);
  }
  return fromHash || sessionStorage.getItem("hub-token") || "";
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method, body: body === undefined ? undefined : JSON.stringify(body),
    headers: { "Authorization": "Bearer " + state.token, "Content-Type": "application/json" },
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
  return res.json();
}

function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text; el.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 2600);
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const base = p => p ? p.replace(/\/+$/, "").split("/").pop() : "未归属项目";
const day = t => t ? new Date(t * 1000).toLocaleString("zh-CN", { hour12: false }) : "";

function title(row) {
  if (row.procedure) return row.procedure.task;
  if (row.kind === "raw") {
    const m = row.content.match(/\[user\]:\s*([\s\S]*?)(?=\n\[(?:assistant|user)\]:|$)/);
    return (m ? m[1] : row.content).trim().slice(0, 160);
  }
  return row.content;
}

async function load() {
  const data = await api("GET", "/v1/hub/memories");
  state.rows = data.memories;
  state.byId = Object.fromEntries(state.rows.map(r => [r.id, r]));
  render();
}

function visible() {
  const text = state.text.trim().toLowerCase();
  return state.rows.filter(r =>
    (state.history || r.is_latest) &&
    (state.project === "*" || r.project === state.project) &&
    (state.kind === "*" || r.kind === state.kind) &&
    (!state.hits || state.hits.has(r.id)) &&
    (!text || (r.content + " " + r.project).toLowerCase().includes(text)));
}

function counts(key, rows) {
  const out = {};
  for (const r of rows) out[r[key]] = (out[r[key]] || 0) + 1;
  return Object.entries(out).sort((a, b) => b[1] - a[1]);
}

function nav(label, value, current, n, attr) {
  return `<div class="nav ${value === current ? "on" : ""}" data-${attr}="${esc(value)}"
    title="${esc(value)}"><span>${esc(label)}</span><span>${n}</span></div>`;
}

function chain(row) {
  // Older versions first, walking supersedes; then newer ones via superseded_by.
  const older = [], seen = new Set([row.id]);
  let cur = row;
  while (cur.supersedes.length) {
    const prev = state.byId[cur.supersedes[0]];
    if (!prev || seen.has(prev.id)) break;
    seen.add(prev.id); older.unshift(prev); cur = prev;
  }
  const newer = [];
  cur = row;
  while (cur.superseded_by.length) {
    const next = state.byId[cur.superseded_by[0]];
    if (!next || seen.has(next.id)) break;
    seen.add(next.id); newer.push(next); cur = next;
  }
  const all = [...older, row, ...newer];
  if (all.length < 2) return "";
  return `<h4>版本历史（旧 → 新）</h4><div class="chain">${all.map(v =>
    `<div class="${v.is_latest ? "cur" : "past"}">${esc(day(v.at))}　${esc(title(v))}</div>`).join("")}</div>`;
}

function detail(row) {
  if (state.editing === row.id) {
    const value = row.procedure ? row.procedure.solution : row.content;
    return `<div class="body"><h4>${row.procedure ? "修改方案（任务描述保持不变）" : "修改内容"}</h4>
      <textarea id="edit-${row.id}">${esc(value)}</textarea>
      <div class="actions"><button class="primary" data-save="${row.id}">保存为新版本</button>
      <button data-cancel="1">取消</button></div></div>`;
  }
  const p = row.procedure;
  let html = p
    ? `<h4>方案</h4><pre>${esc(p.solution)}</pre>` +
      (p.files && p.files.length ? `<h4>涉及文件</h4><pre>${esc(p.files.join("\n"))}</pre>` : "") +
      (p.boundary_envs ? `<h4>适用条件</h4><pre>${esc(p.boundary_envs)}</pre>` : "")
    : `<pre>${esc(row.content)}</pre>`;
  html += chain(row);
  const sources = row.source_ids.map(id => state.byId[id]).filter(Boolean);
  if (sources.length) {
    html += `<h4>来自哪段对话</h4>` + sources.map(s =>
      `<details><summary>${esc(day(s.at))}　${esc(title(s))}</summary><pre>${esc(s.content)}</pre></details>`).join("");
  }
  if (row.is_latest && row.kind !== "raw") {
    html += `<div class="actions"><button data-edit="${row.id}">编辑</button>
      <button class="danger" data-del="${row.id}">删除</button></div>`;
  }
  return `<div class="body">${html}</div>`;
}

function card(row) {
  const open = state.open.has(row.id);
  const state_ = row.is_latest ? "" : (row.deleted ? "已删除" : "已被新版本取代");
  return `<div class="card ${row.is_latest ? "" : "old"} ${state.hits && state.hits.has(row.id) ? "hit" : ""}">
    <div class="head" data-toggle="${row.id}">
      <span class="tag k-${esc(row.kind)}">${esc(KIND[row.kind] || row.kind)}</span>
      <span class="title">${esc(title(row))}</span>
    </div>
    <div class="meta">${esc(base(row.project))} · ${esc(row.source || "—")} · ${esc(day(row.at))}
      ${state_ ? " · " + state_ : ""}</div>
    ${open ? detail(row) : ""}
  </div>`;
}

const LOGO_SVG = `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#0f1419" stroke="#243042" stroke-width="2"/><g stroke="#5fb3f0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M29 18a6 6 0 0 0-10 3 6.5 6.5 0 0 0-3 11 6.5 6.5 0 0 0 2 11 6 6 0 0 0 11 3V18Z"/><path d="M21 26c2 0 4 1.5 4 3.5M20 37c2.5 0 4.5-1.5 5-3.5"/><path d="M18 18L10 10M10 16V10h6"/><path d="M18 46L10 54M16 54h-6v-6"/></g><g stroke="#d3a0ff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M35 18a6 6 0 0 1 10 3 6.5 6.5 0 0 1 3 11 6.5 6.5 0 0 1-2 11 6 6 0 0 1-11 3V18Z"/><path d="M43 26c-2 0-4 1.5-4 3.5M44 37c-2.5 0-4.5-1.5-5-3.5"/><path d="M46 18l8-8M48 10h6v6"/><path d="M46 46l8 8M54 48v6h-6"/></g></svg>`;

function render() {
  const root = document.getElementById("root");
  if (!state.token) {
    root.innerHTML = `<div class="login"><h2>需要 Hub 的访问令牌</h2>
      <p>在终端运行 <code>memhub ui</code>，会带着令牌打开这个页面。</p></div>`;
    return;
  }
  const scoped = state.rows.filter(r => state.history || r.is_latest);
  const inProject = scoped.filter(r => state.project === "*" || r.project === state.project);
  const rows = visible();
  root.innerHTML = `<div class="app">
    <aside>
      <div class="brand">${LOGO_SVG}<span>memhub</span></div>
      <h2>项目</h2>
      ${nav("全部", "*", state.project, scoped.length, "project")}
      ${counts("project", scoped).map(([p, n]) => nav(base(p), p, state.project, n, "project")).join("")}
      <h2>类型</h2>
      ${nav("全部", "*", state.kind, inProject.length, "kind")}
      ${counts("kind", inProject).map(([k, n]) => nav(KIND[k] || k, k, state.kind, n, "kind")).join("")}
    </aside>
    <main>
      <div class="bar">
        <input type="search" id="q" placeholder="筛选正文；回车按语义搜索" value="${esc(state.text)}">
        ${state.hits ? `<button data-clear="1">清除语义结果</button>` : ""}
        <label class="chk"><input type="checkbox" id="hist" ${state.history ? "checked" : ""}> 显示历史版本</label>
        <button data-reload="1">刷新</button>
      </div>
      <div class="summary">${rows.length} 条${state.hits ? "（语义搜索结果）" : ""}</div>
      ${rows.length ? rows.slice(0, 500).map(card).join("") : `<div class="empty">没有匹配的记忆</div>`}
    </main></div>`;
  const q = document.getElementById("q");
  q.oninput = () => { state.text = q.value; renderKeepFocus(); };
  q.onkeydown = e => { if (e.key === "Enter") semantic(q.value); };
  document.getElementById("hist").onchange = e => { state.history = e.target.checked; render(); };
}

function renderKeepFocus() {
  const pos = document.getElementById("q").selectionStart;
  render();
  const q = document.getElementById("q");
  q.focus(); q.setSelectionRange(pos, pos);
}

async function semantic(query) {
  if (!query.trim()) return;
  const data = await api("POST", "/v1/hub/recall", { query, limit: 20, raw_limit: 5, procedure_limit: 10 });
  const ids = new Set();
  for (const group of Object.values(data.memories)) for (const item of group) ids.add(item.memory_id);
  for (const item of data.conversations) ids.add(item.memory_id);
  state.hits = ids; state.text = ""; state.project = "*"; state.kind = "*";
  render();
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-project],[data-kind],[data-toggle],[data-edit],[data-del],[data-save],[data-cancel],[data-reload],[data-clear]");
  if (!t) return;
  const d = t.dataset;
  try {
    if (d.project !== undefined) { state.project = d.project; state.kind = "*"; }
    else if (d.kind !== undefined) state.kind = d.kind;
    else if (d.toggle) state.open.has(d.toggle) ? state.open.delete(d.toggle) : state.open.add(d.toggle);
    else if (d.edit) state.editing = d.edit;
    else if (d.cancel) state.editing = null;
    else if (d.clear) state.hits = null;
    else if (d.reload) { await load(); toast("已刷新"); return; }
    else if (d.save) {
      const res = await api("PUT", "/v1/hub/memories/" + d.save,
                            { content: document.getElementById("edit-" + d.save).value });
      state.editing = null; state.open.delete(d.save); state.open.add(res.memory_id);
      await load(); toast("已保存为新版本，会同步到其他设备"); return;
    } else if (d.del) {
      if (!confirm("删除这条记忆？它会留在历史版本里，并同步到其他设备。")) return;
      await api("DELETE", "/v1/hub/memories/" + d.del);
      await load(); toast("已删除"); return;
    }
    render();
  } catch (err) { toast("失败：" + err.message); }
});

state.token = readToken();
if (state.token) load().catch(err => { document.getElementById("root").innerHTML =
  `<div class="login"><h2>连不上 Hub</h2><p>${esc(err.message)}</p></div>`; });
else render();
</script>
</body>
</html>
