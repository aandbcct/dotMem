# 首次运行复制到 ~/.memhub/config.yaml。
# 优先级：显式参数 > MEMHUB_* 环境变量 > YAML > preset > 默认值。
# 构造客户端必须同时有三把钥匙，缺一会在启动时拒绝：
#   jev_api_key    写入时判断新增 / 重复 / 更新（System One，不是 Chat Completions）
#   llm_api_key    抽取候选、System 2 归纳（OpenAI 兼容）
#   embed_api_key  向量索引与检索（OpenAI 兼容）
# 三个地址都可以改成你自己的服务：jev_endpoint、llm_base_url、embed_base_url。
# 对应环境变量：MEMHUB_JEV_API_KEY / MEMHUB_LLM_API_KEY / MEMHUB_EMBED_API_KEY，
# 以及 MEMHUB_JEV_ENDPOINT / MEMHUB_LLM_BASE_URL / MEMHUB_EMBED_BASE_URL。
# 密钥建议只放环境变量，不要把填好的本地配置提交到 git。
mode: system1
storage_dir: ./.memhub_data
preset: default

# Hub 入库前是否自动把识别到的密钥（OpenAI / GitHub / AWS / JWT / URL 密码等）
# 替换成 <redacted type='...'/>。默认 false：个人助理场景下「记住我的 key」应当生效。
# 设为 true 可防止工具片段里的密钥被长期保存；<private> 标注始终有效。
redact_secrets: false

# JEV。默认公开端点；地区不可达时换成你自己的 jev_endpoint。
jev_api_key: ""
jev_endpoint: https://api.typesafe.ai/v1/systemone
jev_model: jev-1.13.0
reconcile_concurrency: 4
reconcile_candidate_limit: 64
reconcile_batch_size: 1
# 低于该置信度的关系按 SUPPLEMENT 独立写入，不再复核；0 = 关闭置信度路由。
reconcile_review_confidence: 0.0
request_outcome_ttl_seconds: 604800
jev_max_questions: 64
jev_max_request_chars: 100000
jev_max_question_chars: 60000
jev_timeout: 30

# 生成模型：候选文本、System 2 推导。不负责关系裁决。llm_base_url 可改。
llm_api_key: ""
llm_base_url: https://api.openai.com/v1
llm_model: gpt-4o-mini
# llm_context_window: 32768
# llm_completion_reserve: 4096

# Embedding：索引、检索，以及关系比较前的相似度路由。embed_base_url 可改。
embed_api_key: ""
embed_base_url: https://api.openai.com/v1
embed_model: text-embedding-3-small
embed_dim: 1536

# dual 的显式 digest；按真实 evidence IDs 分页，不靠 cluster 丢弃材料。
system2_max_prompt_facts: 120
write_serialize_per_user: false
persist_history: false
purge_done_queues: true
# 版本日志 versions.db 始终持久化，persist_history 仅控制附加 history.db 审计。
# high_recall 只扩大材料预算；不改变关系语义。
